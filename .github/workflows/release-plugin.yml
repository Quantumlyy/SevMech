name: Release plugin

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: Which version segment to bump
        type: choice
        default: patch
        options:
          - major
          - minor
          - patch
          - revision

permissions:
  contents: write          # lets the reusable workflow create the release + push the bump commit

jobs:
  build:
    uses: ./.github/workflows/build-plugin.yml
    with:
      # The DLL and manifest keep AnoMech's InternalName, so SevMech replaces AnoMech in Dalamud.
      internal_name: AnoMech
      solution_name: AnoMech
      version_bump: ${{ inputs.version_bump }}
      plugin_repo: Quantumlyy/MyDalamudPlugins
      plugin_repo_branch: main
    secrets:
      PAT: ${{ secrets.GH_PREPO_PAT }}
